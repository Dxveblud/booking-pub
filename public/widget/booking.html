<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <title>Prenota</title>
  <link rel="stylesheet" href="/widget/booking.css">
  <script src="/widget/booking.js" defer></script>
</head>
<body>
  <div class="bk">
    <header class="bk-header">
      <button type="button" class="bk-icon-btn" id="bk-back" aria-label="Indietro" hidden>&#8592;</button>
      <div class="bk-title">
        <strong id="bk-business">Prenota</strong>
        <span id="bk-step-label">Scegli il servizio</span>
      </div>
      <button type="button" class="bk-icon-btn" id="bk-close" aria-label="Chiudi" hidden>&#10005;</button>
    </header>

    <div class="bk-progress" aria-hidden="true"><span id="bk-progress-bar"></span></div>

    <main class="bk-body" id="bk-body" aria-live="polite">
      <!-- Step 1: servizio -->
      <section class="bk-step" data-step="service">
        <ul class="bk-list" id="bk-services"></ul>
      </section>

      <!-- Step 2: giorno -->
      <section class="bk-step" data-step="day" hidden>
        <div class="bk-days" id="bk-days" role="listbox" aria-label="Giorni disponibili"></div>
        <p class="bk-muted" id="bk-days-empty" hidden>Nessun giorno disponibile al momento.</p>
      </section>

      <!-- Step 3: orario -->
      <section class="bk-step" data-step="time" hidden>
        <p class="bk-subtitle" id="bk-time-date"></p>
        <div class="bk-slots" id="bk-slots"></div>
        <p class="bk-muted" id="bk-slots-empty" hidden>Nessun orario libero in questo giorno.</p>
      </section>

      <!-- Step 4: dati cliente -->
      <section class="bk-step" data-step="details" hidden>
        <form id="bk-form" novalidate>
          <label class="bk-field">
            <span>Nome e cognome</span>
            <input name="name" autocomplete="name" required minlength="2" maxlength="80">
          </label>
          <label class="bk-field">
            <span>Telefono</span>
            <input name="phone" type="tel" autocomplete="tel" inputmode="tel" required maxlength="20" placeholder="+39 ...">
          </label>
          <label class="bk-field">
            <span>Note <small>(facoltative)</small></span>
            <textarea name="notes" rows="2" maxlength="500"></textarea>
          </label>
          <p class="bk-error" id="bk-form-error" hidden></p>
          <button type="submit" class="bk-primary">Continua</button>
        </form>
      </section>

      <!-- Step 5: riepilogo -->
      <section class="bk-step" data-step="confirm" hidden>
        <dl class="bk-summary" id="bk-summary"></dl>
        <p class="bk-error" id="bk-confirm-error" hidden></p>
        <button type="button" class="bk-primary" id="bk-confirm">Conferma prenotazione</button>
      </section>

      <!-- Step 6: fatto -->
      <section class="bk-step bk-done" data-step="done" hidden>
        <div class="bk-check" aria-hidden="true">&#10003;</div>
        <h2>Prenotazione confermata!</h2>
        <p id="bk-done-text"></p>
        <button type="button" class="bk-secondary" id="bk-restart">Nuova prenotazione</button>
      </section>

      <div class="bk-loading" id="bk-loading" hidden><span class="bk-spinner"></span></div>
    </main>
  </div>
</body>
</html>
