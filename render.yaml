# Blueprint Render: https://render.com/docs/blueprint-spec
# Dashboard Render → New → Blueprint → seleziona questa repo.
services:
  - type: web
    name: booking-template
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false # da inserire a mano (stringa di MongoDB Atlas)
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false # da inserire a mano
      - key: WIDGET_ALLOWED_ORIGINS
        value: "*"
