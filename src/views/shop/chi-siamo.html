    <section class="page-hero">
      <div class="hero-shade"></div>
      <div class="container page-hero-inner">
        <p class="eyebrow">Chi siamo</p>
        <h1 id="about-title">{{name}}</h1>
        <span class="rule" aria-hidden="true"></span>
      </div>
    </section>

    <section class="section" id="chi-siamo">
      <div class="container about">
        <figure class="about-photo"><img id="about-img" src="" alt="" loading="lazy" hidden></figure>
        <div class="about-text">
          <p class="lead" id="biz-description"></p>
          <ul class="highlights" id="highlights"></ul>
        </div>
      </div>
    </section>

    <section class="section section-dark" id="team-section">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow">Il team</p>
          <h2>Piacere di conoscerti</h2>
        </div>
        <div class="team" id="team"></div>
      </div>
    </section>

    <section class="section section-tight section-soft" id="brands-section">
      <div class="container">
        <p class="eyebrow center">I prodotti che usiamo</p>
        <ul class="brands" id="brands"></ul>
      </div>
    </section>

    <section class="section" id="reviews-section" hidden>
      <div class="container" id="reviews-box"></div>
    </section>

    <section class="cta">
      <div class="container cta-inner">
        <p class="eyebrow">Su appuntamento</p>
        <h2>Vieni a trovarci.</h2>
        <button type="button" class="btn btn-accent btn-lg" data-booking-open>Prenota ora</button>
      </div>
    </section>
